# =============================================================================
# 27 · 集中日志：Loki + Promtail + Grafana + ruler 告警链
# 生成器模拟 CI 作业日志 → Promtail 抓文件 → Loki 存储/查询 → ruler ERROR
# 速率告警 → Alertmanager → webhook 接收器（端口 292xx 段，与 90xx/281xx/291xx 错峰）
# =============================================================================
services:
  loki:
    image: grafana/loki:3.1.0
    ports: ["29200:3100"]
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki-rules:/loki/rules:ro
      - ./tmp/loki:/loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
  promtail:
    image: grafana/promtail:3.1.0
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - ./tmp/logs:/var/log/ci:ro
      - ./tmp/positions:/tmp
    depends_on: [loki]
  generator:
    image: python:3.12-slim
    volumes:
      - ./configs/generator.py:/generator.py:ro
      - ./tmp/logs:/var/log/ci
    command: ["python3", "/generator.py"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["29201:3000"]
    environment: [GF_SECURITY_ADMIN_PASSWORD=admin]
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
  alertmanager:
    image: prom/alertmanager:v0.25.0
    ports: ["29293:9093"]
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
  webhook-receiver:
    image: python:3.12-slim
    ports: ["29294:9000"]
    volumes:
      - ./configs/webhook_receiver.py:/receiver.py:ro
      - ./tmp:/data
    command: ["python3", "/receiver.py"]
