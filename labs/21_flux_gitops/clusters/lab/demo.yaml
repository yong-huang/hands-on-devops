# Flux 管理的声明态：git 里是什么样，集群就是什么样。
# 改这里 → git push → Flux 自动跟上；手动改集群 → Flux 自动回正。
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app.kubernetes.io/managed-by: flux
spec:
  replicas: 4
  selector:
    matchLabels: { app: demo }
  template:
    metadata:
      labels: { app: demo }
    spec:
      containers:
        - name: web
          image: python:3.12-slim
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: demo-svc
  namespace: demo
spec:
  selector: { app: demo }
  ports:
    - port: 80
      targetPort: 8080
