# =============================================================================
# ansible.cfg — 实验级配置
# =============================================================================
[defaults]
inventory              = inventory
host_key_checking      = False
interpreter_python     = auto_silent
# vault 口令文件：教学环境明文放 tmp/（gitignore）；生产用密码管理器/Agent
vault_password_file    = tmp/vault-pass
stdout_callback        = default
result_format          = yaml

[inventory]
# auto 清单插件默认只认识内置插件；第三方插件必须显式启用
enable_plugins = community.docker.docker_containers, host_list, script, auto, yaml, ini, toml
