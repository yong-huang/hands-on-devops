# 08 · matrix：一次定义，N 份组合
#
# strategy.matrix 是"模板填空"：引擎做笛卡尔积，每个组合派一个独立 job。
# 教学点：job 名会带 (version, variant) 后缀——日志/断言按组合精确匹配；
#        act 串行跑矩阵（默认 1 个并发容器），真仓库才是并行——语义相同、只差速度。
# 裁剪语法 exclude/include 在实验 32 深挖，这里先立住"积"的概念。
name: "08 · matrix 矩阵组合"

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["3.11", "3.12"]
        variant: [slim, full]
    steps:
      - name: 每个组合各跑一次
        run: echo "组合 py=${{ matrix.version }} variant=${{ matrix.variant }}"
