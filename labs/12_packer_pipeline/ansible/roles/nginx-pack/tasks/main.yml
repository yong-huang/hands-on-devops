---
- name: 换用清华 debian 源（deb.debian.org 走 Fastly CDN，国内实测 update 220s；tuna 13s）
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/debian.sources
    regexp: 'deb\.debian\.org'
    replace: mirrors.tuna.tsinghua.edu.cn

- name: 安装 nginx（apt 原生幂等）
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: 渲染站点配置（与实验 06 的 webconf 同构）
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/conf.d/app.conf
  notify: reload nginx

- name: 语法校验
  ansible.builtin.command: nginx -t
  changed_when: false
