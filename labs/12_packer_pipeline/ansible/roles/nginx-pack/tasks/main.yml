---
- name: 安装 nginx（apt 原生幂等）
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: 渲染站点配置（与实验 06 的 webconf 同构）
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/conf.d/app.conf
  notify: reload nginx

- name: 语法校验
  ansible.builtin.command: nginx -t
  changed_when: false
