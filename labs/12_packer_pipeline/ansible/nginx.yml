---
# =============================================================================
# ansible/nginx.yml — 打通实验 06：复用同一结构的 role 打进镜像
# （构建期不启动服务，故省略实验 06 的进程探活 task —— 模板/参数化完全同构）
# =============================================================================
- name: 把 nginx 配置工程化进镜像
  hosts: all
  # packer 的 ansible 插件对 docker builder 生成 docker 连接的 inventory（use_proxy=false）；
  # 千万不要写 connection: local —— 那会让任务跑在宿主机上！
  vars:
    ansible_python_interpreter: /usr/local/bin/python3
  gather_facts: true
  pre_tasks:
    # 换源在 role 首任务里做（tuna，实测 13s）；这里只加 apt 超时——
    # 哪天镜像源也挂了，60s 内失败暴露，而不是无限挂起
    - name: 写 apt 超时（快速失败保护）
      ansible.builtin.copy:
        content: |
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "2";
        dest: /etc/apt/apt.conf.d/99ci-timeout
  roles:
    - role: nginx-pack
