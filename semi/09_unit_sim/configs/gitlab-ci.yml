# rtl-gcd · .gitlab-ci.yml（08 lint + 09 unit；11 会装成 needs DAG）
stages:
  - lint
  - unit

# Pod 内拉 LFS 会走 GitLab 广播的 localhost 端点（不可达）：lint/unit 不需要大文件
variables:
  GIT_LFS_SKIP_SMUDGE: "1"

# ── 08 加装：Lint 门禁（verilator -Wall，告警即红，codequality 上 MR widget）──
lint:
  stage: lint
  image: localhost:28250/semi/eda-base:1.0
  tags: [eda]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - verilator --lint-only -Wall rtl/*.v > lint.log 2>&1 || true
    - cat lint.log
    - python3 tools/verilator2codequality.py lint.log codequality.json
    # 门禁按 JSON 条数判（[] 也是非空文件，[ -s ] 会误伤干净 lint）
    - python3 -c "import json,sys; n=len(json.load(open('codequality.json'))); print(f'lint 告警 {n} 条'); sys.exit(1 if n else 0)"
    - echo "lint 干净"
  artifacts:
    when: always
    reports:
      codequality: codequality.json
    paths: [lint.log, codequality.json]   # 双写：reports 给 widget，paths 进归档供 API 拉取
    expire_in: 7 day

# ── 09 加装：单元仿真（cocotb + iverilog，JUnit 上 MR 测试 Tab）──
unit:
  stage: unit
  image: localhost:28250/semi/eda-base:1.0
  tags: [eda]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - python3 sim/run_tests.py            # cocotb 2.x runner；results.xml 落在 sim/
  artifacts:
    when: always
    reports:
      junit: sim/results.xml             # MR 测试 Tab 的数据源
    paths: [sim/results.xml]             # 双写进归档：report 类不进 /artifacts zip
    expire_in: 7 day
