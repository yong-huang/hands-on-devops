# runner-k8s 部署清单：ConfigMap（config.toml）+ SA + Deployment
# 镜像用 kind load 预载（docker.m.daocloud.io/gitlab/gitlab-runner:latest），免节点外拉
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner
  namespace: gitlab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-k8s-config
  namespace: gitlab
data:
  config.toml: |
__RUNNER_TOML__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner
  namespace: gitlab
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/attach", "pods/log", "secrets", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner
  namespace: gitlab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: gitlab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-k8s
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runner-k8s
  template:
    metadata:
      labels:
        app: runner-k8s
    spec:
      serviceAccountName: gitlab-runner
      containers:
        - name: runner
          image: docker.m.daocloud.io/gitlab/gitlab-runner:latest
          imagePullPolicy: IfNotPresent      # 镜像已 kind load 预载
          command: ["gitlab-runner", "run", "--user=gitlab-runner", "--working-directory=/home/gitlab-runner"]
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab-runner
      volumes:
        - name: config
          configMap:
            name: runner-k8s-config
