# =============================================================================
# 🏁 12 · 终极串联 — 告警定义（应用包 lab_loop_alerts）
#
# 两条告警：
#   error_rate_high  错误率 >20%（最近 100 个请求，恒真可达——真实告警语义）
#   service_down     最近 3 分钟 loop_demo 事件数 = 0（服务下线反向告警）
# 动作均 webhook → 宿主机接收器 :28321。事件时间与真实时钟脱节的问题：
# error_rate 用固定 7 天窗口（数据仍在）；demo-web 的事件时间即当前时钟（HEC time 与文件
# 日志时间戳都是写入时刻），dispatch.earliest_time=-3m 直接可用。
# =============================================================================
[error_rate_high]
action.webhook = 1
action.webhook.param.url = http://host.docker.internal:28321/notify
alert.severity = error
alert.suppress = 0
alert.track = 0
cron_schedule = */2 * * * *
dispatch.earliest_time = -8d
dispatch.latest_time = now
enableSched = 1
search = index=loop_demo | stats count as total, count(eval(status>=500)) as errors | eval err_pct=round(errors/max(total,1)*100,1) | where err_pct > 20

[service_down]
action.webhook = 1
action.webhook.param.url = http://host.docker.internal:28321/notify
alert.severity = critical
alert.suppress = 0
alert.track = 0
cron_schedule = */1 * * * *
dispatch.earliest_time = -3m
dispatch.latest_time = now
enableSched = 1
search = index=loop_demo | stats count | where count = 0
