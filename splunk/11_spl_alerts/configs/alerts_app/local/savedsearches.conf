# =============================================================================
# 11 · 告警引擎 — savedsearches.conf（调度搜索 + webhook 告警动作）
#
# 教程数据事件时间固定在 2026-11-07~11-14，与"现在"无关——因此触发条件
# 不能用真实时间窗，改用"任意时间全量窗口 + 固定为真的条件"（count>0），
# 让 cron 调度本身成为触发源，专测"调度→送达"链路。
# cron 表达式 */2（每 2 分钟）——间隔断言用 3 次触发的到达时刻差。
# =============================================================================
[hec_errorrate_alert]
action.webhook = 1
action.webhook.param.url = http://host.docker.internal:28321/notify
alert.severity = warning
alert.suppress = 0
alert.track = 0
cron_schedule = */2 * * * *
description = 教程数据错误事件计数（恒真触发，专测调度链路）
dispatch.earliest_time = 0
dispatch.latest_time = now
enableSched = 1
search = index=tutorial sourcetype=access_combined_wcookie status>=400 | stats count as err_events
