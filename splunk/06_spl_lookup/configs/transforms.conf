# =============================================================================
# 06 · 数据富化 — transforms.conf（三张 lookup 字典的定义）
#
# lookup 字典 = CSV 文件（放 etc/system/lookups/）+ 这里的定义（匹配键）。
# 三张表三种形态：
#   http_status — 精确匹配（status 等值 join）
#   ua_class    — WILDCARD 匹配（ua_prefix 里带 *，UA 串含"Chrome/ Safari/"
#                 双标识，CSV 行序即优先级：Googlebot 系在前，Safari 放最后
#                 兜底——顺序错了 Chrome 会被 Safari 行抢先误判）
#   servers     — 资产映射（host 等值）
# =============================================================================
[http_status]
filename = http_status.csv

[ua_class]
filename = ua_class.csv
match_type = WILDCARD(ua_prefix)

[servers]
filename = servers.csv

# status_counts：perf 步骤用 outputlookup 生成的预聚合字典（status→事件数），
# 用于 join(子搜索全量扫描) vs lookup(读字典) 的机理对照
[status_counts]
filename = status_counts.csv
