# =============================================================================
# 08 · UF 采集链 — 索引器侧接收配置（TLS 9997）
#
# [splunktcp-ssl:9997] 在 9997 开 TLS 的 s2s（forwarder-to-indexer）监听；
# serverCert 是"证书+私钥合并"的 PEM（openssl x509 后拼 key）。
# 自签证书仅本机实验用；生产用 CA 签发并开 sslVerifyServerCert。
# =============================================================================
[splunktcp-ssl:9997]
acceptFrom = *

[sslConfig]
serverCert = /opt/splunk/etc/auth/s2s.pem
