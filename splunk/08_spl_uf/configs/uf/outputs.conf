# =============================================================================
# 08 · UF 采集链 — UF 侧转发目标
#
# server 指向索引器容器名（同一 docker 网络 01_splunk_deploy_default 内可达）。
# 索引器侧 9997 为 TLS 监听；s2s 协议自动协商加密——UF 侧不开 sslVerifyServerCert
# 即可用自签证书（校验关掉，仅限实验）。
# =============================================================================
[tcpout]
defaultGroup = primary

[tcpout:primary]
server = splunk-deploy:9997
sslVerifyServerCert = false
