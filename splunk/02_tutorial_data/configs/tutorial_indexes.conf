# =============================================================================
# tutorial 索引的声明式写法（对照参考，本实验不挂载它）
#
# 本实验脚本用 REST/CLI 即席创建索引（splunk add index tutorial）；生产里
# 索引全部这样声明在 indexes.conf，随部署生效、可进版本管理。两种写法
# 产生完全相同的索引——区别只在"谁记账"：声明式在文件里，即席在 REST 里。
#
# 挂载方式与 lab 01 的 telemetry.conf 相同（bind mount 进 etc 卷的
# system/local/），重启后由 splunkd 读取建索引。
# =============================================================================
[tutorial]
# 三个路径是索引的骨架：db=热/温数据，colddb=冷数据，thawedDB=解冻回灌
homePath   = $SPLUNK_DB/tutorial/db
coldPath   = $SPLUNK_DB/tutorial/colddb
thawedPath = $SPLUNK_DB/tutorial/thaweddb
# 4GB 总量上限 + 90 天冻结期：教学数据防写爆磁盘的常规组合
maxTotalDataSizeMB     = 4096
frozenTimePeriodInSecs = 7776000
