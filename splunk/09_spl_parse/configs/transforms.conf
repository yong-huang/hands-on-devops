# =============================================================================
# 09 · 自定义解析 — transforms.conf（多行栈的首行字段提取）
#
# 被 props.conf 的 REPORT-stack-fields 引用：对每个多行事件的 _raw 跑正则，
# 从首行提取 level/svc/status 三个字段（栈行不影响——REGEX 只需匹配首行）。
# =============================================================================
[stack_fields]
REGEX = ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} (?<level>[A-Z]+) svc=(?<svc>\S+) status=(?<status>\d+)
