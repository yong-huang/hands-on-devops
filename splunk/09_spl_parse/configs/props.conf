# =============================================================================
# 09 · 自定义解析 — props.conf（多行栈 + CSV 结构化两种 sourcetype）
#
# 多行事件（splk_stack）：异常栈一个事件占多行——按"行首时间戳"切事件边界，
# 时间戳同样取行首（TIME_PREFIX + MAX_TIMESTAMP_LOOKAHEAD 收紧避免误判）。
#
# 结构化文件（splk_csv_lab）：INDEXED_EXTRACTIONS=csv 在**索引时**按表头切字段
# （与 lab 05 的 REPORT 搜索时提取相对——入库即有字段，代价是改规则要重灌）。
# =============================================================================
[splk_stack]
SHOULD_LINEMERGE = true
BREAK_ONLY_BEFORE = ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}
MAX_EVENTS = 256
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 19
REPORT-stack-fields = stack_fields

[splk_csv_lab]
INDEXED_EXTRACTIONS = csv
FIELD_DELIMITER = ,
FIELD_QUOTE = "
HEADER_FIELD_LINE_NUMBER = 1
TIMESTAMP_FIELDS = ts
TIME_FORMAT = %Y-%m-%d %H:%M:%S
