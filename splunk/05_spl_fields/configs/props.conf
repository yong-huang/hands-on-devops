# =============================================================================
# 05 · 字段工程 — props.conf（本地 sourcetype：splk_access_lab）
#
# props.conf 管"一个 sourcetype 的数据怎么被读"：时间戳在哪、怎么分行、
# 搜索时挂哪些字段提取。本文件声明自定义 sourcetype splk_access_lab，
# 让 access_combined 格式的日志不依赖出厂解析也能出字段。
#
# 生效方式（见 spl_fields.sh persist 步骤）：docker cp 进容器
# /opt/splunk/etc/system/local/ → docker compose restart（配置只在启动时读）。
# 搜索时字段出现 ≠ 索引时已存——REPORT 是搜索时提取，改完配置已入库的
# 旧事件也会立即出新字段，这是与 INDEXED_EXTRACTIONS 的本质区别。
# =============================================================================
[splk_access_lab]
# 单行日志：绝不合并多行，按换行切事件
SHOULD_LINEMERGE = false
LINE_BREAKER = (\r?\n)
# 时间戳：access 行里 [07/Nov/2026:18:22:16] 这一段
TIME_PREFIX = \[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 25
# 搜索时字段提取：挂在 transforms.conf 的 [splk_access_extract]
REPORT-access = splk_access_extract
