# =============================================================================
# 05 · 字段工程 — transforms.conf（REPORT 引用的正则与字段映射）
#
# 被 props.conf 的 REPORT-access = splk_access_extract 引用：
#   REGEX   带捕获组的正则，对每条 _raw 匹配
#   FORMAT  捕获组 → 字段名映射（$1..$8 对应 REGEX 从左到右的组）
#
# 与 lab 04 crosscheck.py 的参照正则同源（access_combined 行结构），
# 字段名与出厂 access_combined 的字段保持一致，便于两套口径互相印证。
# 注意行尾还有一段响应时间数字，正则不锚定行尾 $——锚死会漏配。
# =============================================================================
[splk_access_extract]
REGEX = ^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) (\S+)[^"]*" (\d+) (\d+) "([^"]*)" "([^"]*)"
FORMAT = clientip::$1 ts::$2 method::$3 uri::$4 status::$5 bytes::$6 referrer::$7 useragent::$8
