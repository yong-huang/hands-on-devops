# =============================================================================
# 07 · HEC 实时接入 — inputs.conf（开启 HEC + 实验专用 token）
#
# HEC（HTTP Event Collector）：进程用 HTTP 直接把 JSON 事件推进 Splunk，
# 不经过文件/转发器——微服务、容器、serverless 的标准入库通道。
#
# 生效方式：docker cp 进容器 system/local + restart（与 lab 05/06 同款）。
# 端口已在 lab 01 compose 预留：宿主 28088 → 容器 8088。
#
# ⚠️ token 仅本机实验用、随仓库公开；生产环境 token 是凭据，走密钥管理。
# =============================================================================
[http]
disabled = 0

[http://hec_lab]
token = 5f3a9c8e2b7d4e6a9c1f8d2b4a6e0c3f
# 开启索引器回执：响应携带 ackId，客户端可确认事件真的落盘（本实验断言 A 依赖）
useACK = true
