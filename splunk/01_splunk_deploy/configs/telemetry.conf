# =============================================================================
# 关闭遥测上报（部署即生效，不用登录 Web 后手动关）
#
# 现象：Splunk 默认定期向 splunk.com 回传使用统计（sendSupportData 默认 true）。
# 本仓零云约束下没有必要；生产内网隔离环境同样建议关闭。
#
# 挂载方式见 docker-compose.yml：文件级 bind mount 叠进 etc 卷的
# system/local/ 目录——system/local 是 Splunk 的"本地覆盖配置"目录，
# 放这里的配置优先于 etc/system/default 里的出厂默认（default 目录只读）。
# 验证：splunk_deploy.sh persist 重启后此文件仍在（etc 卷持久化断言）。
# =============================================================================
[telemetry]
sendSupportData = false
