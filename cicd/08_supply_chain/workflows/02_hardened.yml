# ✅ 加固版：pull_request（非 target）+ 显式 permissions + 零第三方 action
#
# 加固点 1：pull_request（非 target）—— fork PR 的代码在 PR 上下文运行：
#           secrets 为空、GITHUB_TOKEN 只读（平台强制，不靠 workflow 自觉）
# 加固点 2：permissions 显式声明最小集合（危险版也写了同一块——写在明处、
#           不依赖平台默认值是两版共同的基本功；真正的分野是事件类型）
# 加固点 3：不引用任何第三方 action——真仓库若要引用，必须 40 位 SHA pin
#           （而非 tag/branch），并用 check_sha_pin.py 扫描兜底
name: hardened-pr
on: pull_request

# 加固：权限收敛到最小（只读仓库内容 + 写 PR 评论）
permissions:
  contents: read
  pull-requests: write

jobs:
  safe-check:
    runs-on: ubuntu-latest
    steps:
      # act 本地不需要真的 checkout——此步在真仓库中应使用
      # actions/checkout@<40位SHA>（SHA pin 加固）
      - name: Simulate checkout
        run: echo "would checkout ${{ github.event.pull_request.head.sha }}".

      - name: Prove isolation
        run: |
          echo "✅ 加固验证："
          echo "  event: ${{ github.event_name }}"
          echo "  GITHUB_TOKEN 权限范围（已收敛）"
          # 证明 secrets 不可访问（PR 上下文中 secrets 为空）
          if [ -n "${{ secrets.DEPLOY_TOKEN || '' }}" ]; then
            echo "  [!] secrets 可访问——隔离失效"
          else
            echo "  [ok] secrets 不可访问（fork PR 隔离生效）"
          fi

      - name: SHA pin demo
        run: echo "all third-party actions pinned to SHA"
