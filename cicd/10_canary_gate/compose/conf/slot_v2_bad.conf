# green 槽站点：v2 故障态（注入用）——业务路径 /api 全部 503。
# 注意 /version 仍然 200：模拟"健康检查绿、业务路径挂"的真实故障形态。
server {
    listen 80;
    location = /version {
        default_type text/plain;
        return 200 "v2\n";
    }
    location = /api {
        default_type text/plain;
        return 503 "v2-fault\n";
    }
    location / {
        default_type text/plain;
        return 503 "green · v2 (fault injected)\n";
    }
}
