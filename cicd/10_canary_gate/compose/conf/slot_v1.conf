# blue 槽站点：v1 稳定版
server {
    listen 80;
    location = /version {
        default_type text/plain;
        return 200 "v1\n";
    }
    location = /api {
        default_type text/plain;
        return 200 "v1-ok\n";
    }
    location / {
        default_type text/plain;
        return 200 "blue · v1\n";
    }
}
