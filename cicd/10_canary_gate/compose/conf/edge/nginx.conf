worker_processes 1;
events { worker_connections 1024; }
http {
    # 晋级/中止都只改 active.conf 一个文件 + reload
    include /etc/nginx/upstream/active.conf;

    server {
        listen 80;
        location / {
            proxy_pass http://app;
            # 兜底：默认 proxy_next_upstream 仅 error timeout（503 会如实
            # 透传），但若误配 http_503/http_5xx 重试，503 会被静默换成
            # 另一台的 200——门禁失明。显式 off 杜绝这种误配。
            proxy_next_upstream off;
        }
    }
}
