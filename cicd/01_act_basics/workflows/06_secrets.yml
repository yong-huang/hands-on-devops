# 06 · secrets：注入、显式映射与日志打码
#
# act -s TOKEN=xxx 等价于 GitHub 仓库 Settings → Secrets，值进的是
# secrets 上下文（${{ secrets.TOKEN }}）——不会自动出现在进程环境里，
# 必须用 env: 显式映射才交到 shell 手上（GitHub 语义如此，act 同构）。
# 教学点①：打码发生在【日志输出层】，不是变量层——映射后进程里 $TOKEN
#          是原值（程序能正常用），但任何打印到日志的内容都被替换成 ***。
# 教学点②：反面证据就在日志里——哪怕你的报错文案里手写了 secret 字面量，
#          引擎也会把它抹掉。但秘密一旦落进文件/artifact，打码就罩不住了。
name: "06 · secrets 注入与打码"

on: push

jobs:
  masked:
    runs-on: ubuntu-latest
    steps:
      - name: 日志层——映射后打印，自动打码
        env:
          TOKEN: ${{ secrets.TOKEN }} # 唯一的合法通道：secrets 上下文 → env
        run: echo "token=$TOKEN" # 日志里是 token=***，脚本断言查这一行

      - name: 进程层——原值可用（反面教材：绝不要再 echo 一遍）
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          if [ "${TOKEN:-}" = "super-secret-42" ]; then
            echo "SECRETS-OK 进程拿得到原值、日志只见 ***——两层语义分清"
          else
            echo "TOKEN 未注入：跑法必须是 act ... -s TOKEN=super-secret-42"
            exit 1 # secret 缺失要响亮地红，不能静默跳过
          fi
