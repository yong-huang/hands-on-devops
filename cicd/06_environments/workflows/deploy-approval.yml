name: deploy-with-approval
# 带环境审批门的部署 workflow
#
# 引用 environment: production 后，job 会在该环境的 protection rule
# （required reviewers）处卡住，等待审批人点击 approve 后才继续。
# 审批前后两次 gh api 查询的 status 变化是本实验的核心取证。
name: deploy-with-approval
on: push

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy（模拟）
        run: |
          echo "deploying to production..."
          echo "deployed at $(date -u +%FT%TZ)"
