# 业务流水线 2：prod 环境部署
#
# 与 deploy-staging 调用同一个 reusable workflow——改共享逻辑只改 callee 一处。
# prod 差异：不跑 lint（run_lint: false），node 版本钉 20。
name: deploy-prod
on: push

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      environment: production
      node_version: "20"
      run_lint: false
    secrets:
      deploy_token: "fake-prod-token"

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      # act 0.2.89 不支持本地 composite action——同 staging 适配
      - name: Deploy production (act 适配)
        id: hello
        run: |
          greeting="hello production"
          status="ok"
          echo "greeting=${greeting}" >> "$GITHUB_OUTPUT"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "greeting: ${greeting}"
          echo "status: ${status}"
          echo "build_id: ${{ needs.build-test.outputs.build_id }}"
          echo "test: ${{ needs.build-test.outputs.test_result }}"
          case "${greeting}" in
            *"production"*) echo "[ok] greeting 指向 production" ;;
            *) echo "[fail] greeting 未指向 production" >&2; exit 1 ;;
          esac
