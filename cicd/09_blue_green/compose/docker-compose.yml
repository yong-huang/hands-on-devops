# 蓝绿双槽拓扑：blue(现役 v1) + green(空闲 v2) + edge(唯一对外入口)
#
# 对外只开 edge 的 29080；blue/green 的 29081/29082 仅供实验从宿主机
# 直连取证（健康检查、旧槽保活断言），生产里这两个端口不对外。
name: cicd09-blue-green

services:
  blue:
    image: nginx:1.27-alpine        # 槽版本即镜像版本：v1
    ports:
      - "29081:80"                  # 宿主机直连取证用
    volumes:
      - ./conf/slot_v1.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 显式 127.0.0.1：busybox wget 对 localhost 先试 ::1，而槽只听 IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/version"]
      interval: 2s
      timeout: 2s
      retries: 15

  green:
    image: nginx:1.25-alpine        # v2
    ports:
      - "29082:80"
    volumes:
      - ./conf/slot_v2.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/version"]
      interval: 2s
      timeout: 2s
      retries: 15

  edge:
    image: nginx:1.27-alpine
    ports:
      - "29080:80"                  # 唯一对外入口
    volumes:
      - ./conf/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/edge/upstream:/etc/nginx/upstream:ro   # 切槽 = 宿主机重写 active.conf
