worker_processes 1;
events { worker_connections 1024; }
http {
    # 切换点：active.conf 的内容决定流量进 blue 还是 green。
    # 切槽只改这一个文件 + reload，edge 自身不动。
    include /etc/nginx/upstream/active.conf;

    server {
        listen 80;
        location / {
            proxy_pass http://app;
            # 关掉"上游出错换下一台重试"——本实验只有一个活动槽，
            # 保留默认重试会掩盖切换瞬间的真实失败，取证要诚实
            proxy_next_upstream off;
        }
    }
}
