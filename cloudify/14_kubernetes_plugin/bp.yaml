tosca_definitions_version: cloudify_dsl_1_5

# ASCII only in YAML. Official cloudify-kubernetes-plugin in LOCAL mode:
# kubeconfig ships inside the blueprint archive (blueprint_file_name variant),
# a FileDefinedResource applies Deployment+Service onto kind-cfy-lab.
imports:
  - vendor/types.yaml
  - vendor/kubernetes-plugin.yaml

node_templates:
  master:
    type: cloudify.kubernetes.nodes.Master
    properties:
      configuration:
        blueprint_file_name: kubeconfig.yaml

  web:
    type: cloudify.kubernetes.resources.FileDefinedResource
    properties:
      client_config:
        configuration:
          blueprint_file_name: kubeconfig.yaml
      file:
        resource_path: manifest.yaml
    relationships:
      - type: cloudify.relationships.connected_to
        target: master

outputs:
  node_port:
    description: NodePort of the service (fixed 30080, host-mapped to 28120)
    value: 30080
