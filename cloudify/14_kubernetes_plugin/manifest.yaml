apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfy14-web
  namespace: default
  labels:
    app: cfy14-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cfy14-web
  template:
    metadata:
      labels:
        app: cfy14-web
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cfy14-web
  namespace: default
spec:
  type: NodePort
  selector:
    app: cfy14-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
