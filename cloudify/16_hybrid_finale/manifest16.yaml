apiVersion: v1
kind: ConfigMap
metadata:
  name: cfy16-cm
  namespace: default
data:
  web_url: "http://localhost:28130/ (host-mapped NodePort/ports from the same blueprint)"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfy16-web
  namespace: default
  labels:
    app: cfy16-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cfy16-web
  template:
    metadata:
      labels:
        app: cfy16-web
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cfy16-web
  namespace: default
spec:
  type: NodePort
  selector:
    app: cfy16-web
  ports:
    - port: 80
      nodePort: 30080
