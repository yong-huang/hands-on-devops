tosca_definitions_version: cloudify_dsl_1_5

# negative case: ctx.abort_operation must stop the workflow IMMEDIATELY
# (no retries, execution failed) even though script tasks are retryable in general.
imports:
  - vendor/types.yaml

node_types:
  handson.nodes.Fatal:
    derived_from: cloudify.nodes.Root
    interfaces:
      cloudify.interfaces.lifecycle:
        create:
          implementation: scripts/fatal.py

node_templates:
  fatal:
    type: handson.nodes.Fatal
