tosca_definitions_version: cloudify_dsl_1_5

# ASCII only in YAML. Demonstrates "Terraform as a TOSCA node" via the script
# plugin wrapper: local terraform binary applies a bundled TF module (docker
# containers), outputs flow into runtime properties, drift check + converge on
# a live deployment. The OFFICIAL terraform plugin is kept as a negative case
# (bp_official.yaml): it hard-depends on Manager-only env (measured).
imports:
  - vendor/types.yaml

inputs:
  tf_binary:
    type: string
    default: /opt/homebrew/bin/terraform
  tf_zip:
    type: string
    default: /tmp/handson08/tf-module.zip
  workdir:
    type: string
    default: /tmp/handson08/work
  tf_cli_config:
    type: string
    default: 
  replicas:
    type: integer
    default: 1

node_templates:
  tf_wrapped:
    type: cloudify.nodes.Root
    interfaces:
      cloudify.interfaces.lifecycle:
        create:
          implementation: scripts/tf_apply.sh
          inputs:
            tf_binary: { get_input: tf_binary }
            tf_zip: { get_input: tf_zip }
            tf_cli_config: { get_input: tf_cli_config }
            workdir: { get_input: workdir }
            replicas: { get_input: replicas }
        delete:
          implementation: scripts/tf_destroy.sh
          inputs:
            tf_binary: { get_input: tf_binary }
            tf_cli_config: { get_input: tf_cli_config }
            workdir: { get_input: workdir }
      handson.interfaces.maintenance:
        apply:
          implementation: scripts/tf_apply.sh
          inputs:
            tf_binary: { get_input: tf_binary }
            tf_zip: { get_input: tf_zip }
            tf_cli_config: { get_input: tf_cli_config }
            workdir: { get_input: workdir }
            replicas: { get_input: replicas }
        drift_check:
          implementation: scripts/tf_refresh.sh
          inputs:
            # replicas deliberately NOT an input here: it must come via
            # operation_kwargs at call time (blueprint input + kwargs of the
            # same name collide without allow_kwargs_override - measured)
            tf_binary: { get_input: tf_binary }
            tf_cli_config: { get_input: tf_cli_config }
            workdir: { get_input: workdir }

outputs:
  tf_names:
    value: { get_attribute: [tf_wrapped, tf_names] }
