tosca_definitions_version: cloudify_dsl_1_5

# NEGATIVE case (kept as evidence): official cloudify-ansible-plugin install
# in local mode. Measured: fails fast on Manager-only runtime env, same
# family as the terraform plugin (see 08).
imports:
  - vendor/types.yaml
  - vendor/ansible-plugin.yaml

node_templates:
  probe:
    type: cloudify.nodes.ansible.Playbook
    properties:
      playbook_path: playbooks/site.yaml
      sources:
        - hosts:
            localhost:
              ansible_connection: local
