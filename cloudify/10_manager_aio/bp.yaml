tosca_definitions_version: cloudify_dsl_1_5

# Manager-hosted blueprint: the SHORT import path works here (the Manager
# rewrites it to its bundled spec) - contrast with local mode which must
# vendor types.yaml (experiments 01-09).
imports:
  - cloudify/types/types.yaml

inputs:
  greeting:
    type: string
    default: hello

node_templates:
  hello:
    type: cloudify.nodes.Root
    interfaces:
      cloudify.interfaces.lifecycle:
        create:
          implementation: scripts/create.sh
          inputs:
            who: { get_input: greeting }

outputs:
  msg:
    value: { get_attribute: [hello, said] }
